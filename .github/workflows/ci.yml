name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Check spelling
        uses: crate-ci/typos@v1.48.0

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: src-tauri -> target

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

  agent-sdk:
    name: Agent SDK
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test Agent core and SDK
        run: dotnet test agent/tests/GameTweaks.Agent.Core.Tests/GameTweaks.Agent.Core.Tests.csproj --configuration Release

      - name: Build bundled Agent hosts
        shell: pwsh
        run: ./agent/build-release.ps1

      - name: Upload bundled Agent hosts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: gametweaks-agent-hosts
          path: |
            agent/artifacts/mono
            agent/artifacts/il2cpp
          if-no-files-found: error
          retention-days: 1

  tauri-build:
    name: Tauri Build
    runs-on: ubuntu-latest
    needs:
      - frontend
      - rust
      - agent-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download bundled Agent hosts
        uses: actions/download-artifact@v8.0.0
        with:
          name: gametweaks-agent-hosts
          path: agent/artifacts

      - name: Build Tauri app
        run: pnpm build:tauri

  tauri-bundles:
    name: Tauri Bundles (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.platform }}
    needs:
      - frontend
      - rust
      - tauri-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            name: macOS Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-latest
            name: Linux
            args: ""
          - platform: windows-latest
            name: Windows
            args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download bundled Agent hosts
        uses: actions/download-artifact@v8.0.0
        with:
          name: gametweaks-agent-hosts
          path: agent/artifacts

      - name: Build Tauri bundles
        run: pnpm tauri build --config src-tauri/tauri.pr.conf.json ${{ matrix.args }}

  publish-dev-build:
    name: Publish Dev Build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - spelling
      - frontend
      - rust
      - tauri-build
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: DEV_RELEASE
      release_sha: ${{ github.sha }}
      development: true
    secrets: inherit
