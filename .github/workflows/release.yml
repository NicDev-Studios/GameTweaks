name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "agent-sdk-v*.*.*"

permissions:
  contents: read

jobs:
  publish-release:
    name: Publish beta or stable release
    if: startsWith(github.ref_name, 'v')
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ github.ref_name }}
      release_sha: ${{ github.sha }}
      development: false
    secrets: inherit

  build-agent-sdk:
    name: Build Agent SDK package
    if: startsWith(github.ref_name, 'agent-sdk-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate Agent SDK release tag
        shell: bash
        run: |
          sdk_version="${GITHUB_REF_NAME#agent-sdk-v}"
          package_version="$(dotnet msbuild agent/src/GameTweaks.Agent.Abstractions/GameTweaks.Agent.Abstractions.csproj -getProperty:Version -nologo | tail -n 1 | tr -d '\r')"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if (( ${#sdk_version} > 64 )) || [[ ! "$sdk_version" =~ $semver ]]; then
            echo "Invalid Agent SDK release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          if [[ "$sdk_version" != "$package_version" ]]; then
            echo "Tag version $sdk_version does not match package version $package_version."
            exit 1
          fi
          grep -Fq "AgentVersion = \"$sdk_version\"" agent/src/GameTweaks.Agent.Core/AgentPipeClient.cs
          grep -Fq "GameTweaks Agent\", \"$sdk_version\"" agent/src/GameTweaks.Agent.Mono/Plugin.cs
          grep -Fq "GameTweaks Agent\", \"$sdk_version\"" agent/src/GameTweaks.Agent.IL2CPP/Plugin.cs
          grep -Fq "AGENT_VERSION: &str = \"$sdk_version\"" src-tauri/src/agent.rs
          grep -Fq "GameTweaks.Agent.Abstractions\" Version=\"$sdk_version\"" agent/examples/GameTweaks.Agent.Example.Mono/GameTweaks.Agent.Example.Mono.csproj
          grep -Fq "MinimumAgentVersion = \"$sdk_version\"" agent/examples/GameTweaks.Agent.Example.Mono/Plugin.cs
          grep -Fq "versions are both \`$sdk_version\`" agent/SDK.md
          grep -Fq "GameTweaks.Agent.Abstractions\" Version=\"$sdk_version\"" agent/SDK.md
          grep -Fq "BepInDependency(\"dev.gametweaks.agent\", \"$sdk_version\")" agent/SDK.md
          grep -Fq "agent-sdk-v$sdk_version" agent/README.md
          grep -Fq "version \`$sdk_version\` is published" agent/examples/GameTweaks.Agent.Example.Mono/README.md

      - name: Test Agent core and SDK
        run: dotnet test agent/tests/GameTweaks.Agent.Core.Tests/GameTweaks.Agent.Core.Tests.csproj --configuration Release

      - name: Pack and smoke-test Agent SDK
        shell: pwsh
        run: ./agent/pack-sdk.ps1

      - name: Upload Agent SDK package
        uses: actions/upload-artifact@v7.0.0
        with:
          name: gametweaks-agent-sdk-nuget
          path: agent/artifacts/nuget
          if-no-files-found: error
          retention-days: 1

  publish-agent-sdk:
    name: Publish Agent SDK to NuGet
    if: startsWith(github.ref_name, 'agent-sdk-v')
    needs: build-agent-sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Agent SDK package
        uses: actions/download-artifact@v8.0.0
        with:
          name: gametweaks-agent-sdk-nuget
          path: agent/artifacts/nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: 10.0.x

      - name: Require NuGet publisher identity
        shell: bash
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "Configure the NUGET_USER repository secret with the nuget.org profile name."
            exit 1
          fi

      - name: Request temporary NuGet API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish Agent SDK
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push agent/artifacts/nuget/*.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
